<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080c1a" />
    <meta
      name="description"
      content="Descubra países por região, clima, idioma, moeda e população."
    />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <title>Localização Inteligente</title>
    <script>
      // Aplica o tema salvo antes da página aparecer, para não "piscar" entre claro e escuro.
      (function () {
        try {
          var tema = localStorage.getItem('tema');
          if (tema === 'light' || tema === 'dark') {
            document.documentElement.setAttribute('data-theme', tema);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar a Localização Inteligente.</noscript>
    <div id="root"></div>
  </body>
</html>
