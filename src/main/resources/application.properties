spring.application.name=localizacaointeligente

# Configuração do H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração do servidor
server.port=8080

# Configuração de CORS: endereço(s) do front-end que podem chamar a API (separe por vírgula).
# Se o React subir em outra porta, troque aqui (ex.: http://localhost:3001). Lido por CorsConfig.
app.cors.allowed-origins=http://localhost:3000
